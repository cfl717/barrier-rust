[package]
name = "barrier_protocol"
version = "0.1.0"
edition = "2021"
description = "Barrier protocol implementation in Rust - Phase 1 Scaffold"
license = "GPL-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Byte order utilities
byteorder = "1.5"

# Platform-specific input handling
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11 = { version = "2.21", features = ["xlib", "xtest"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
nix = { version = "0.27", features = ["event"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
core-graphics = "0.23"

[dev-dependencies]
tokio-test = "0.4"
