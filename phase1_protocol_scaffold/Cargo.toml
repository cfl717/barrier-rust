[package]
name = "barrier_protocol"
version = "0.1.0"
edition = "2021"
description = "Barrier protocol implementation in Rust - Phase 1 Scaffold"
license = "GPL-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Byte order utilities
byteorder = "1.5"

# For platform-specific code
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio-test = "0.4"
