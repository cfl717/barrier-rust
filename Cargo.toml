[workspace]
members = [
    "protocol",
    "input-capture",
    "tauri-gui/src-tauri",
]
resolver = "2"

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"
byteorder = "1.5"