[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
description = "Shared application core for Barrier native frontends"

[dependencies]
barrier_protocol = { path = "../protocol" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
dirs = "5.0"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib"] }

[dev-dependencies]
tempfile = "3"
