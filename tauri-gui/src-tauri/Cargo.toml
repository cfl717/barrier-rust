[package]
name = "barrier-tauri"
version = "3.0.0-alpha.1"
description = "Barrier Tauri Backend"
authors = ["Barrier Team"]
license = "GPL-2.0"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
barrier_protocol = { path = "../../protocol" }
log = "0.4"
env_logger = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"

[features]
default = []
